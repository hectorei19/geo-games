/* Home page: Mingo says hello and counts today's games, then one card per game and Play with friends */
.app{max-width:460px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:max(18px,env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
/* small pictures of each game */
.t-countries{background:var(--pink-soft);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}
.t-countries i{border-radius:3px;background:var(--surface)} .t-countries i.f{background:var(--flamingo)}
.t-cities{background:#1B2238;display:flex;align-items:flex-end;justify-content:center;gap:3px;padding-bottom:10px}
.t-cities i{width:7px;border-radius:2px}
.t-cx{background:var(--bg);display:flex;flex-direction:column;gap:4px;box-shadow:inset 0 0 0 2px var(--line)}
.t-cx i{flex:1;border-radius:3px}
.t-top{background:var(--lagoon-soft);display:flex;flex-direction:column;justify-content:center;gap:5px}
.t-top i{height:6px;border-radius:3px;background:var(--lagoon)}
.t-sil{background:var(--lagoon-soft);padding:5px}
.t-sil svg{display:block;width:100%;height:100%}
.t-sil .land{fill:var(--ink);fill-rule:evenodd}
.t-sil .q{fill:var(--flamingo-text);font-family:var(--display);font-weight:700;font-size:30px}
footer{display:flex;flex-direction:column;gap:4px;align-items:center;padding-top:4px}

    <a class="gm-big" id="friends" href="../country-grid/?friends"><span class="gm-dots" aria-hidden="true"><i style="background:var(--flamingo)"></i><i style="background:var(--sky)"></i><i style="background:var(--sun)"></i></span>Play with friends</a>
    <p class="gm-note">Rooms for 2 to 6 phones, in Countries. More games soon.</p>
  </main>
  <footer>
    <p class="gm-note"><b>Daily geography games. Better with friends.</b></p>
    <p class="gm-note">New puzzles every day at midnight, Spain time. Your results are saved on this device only.</p>
  </footer>

const THUMB={
  borderline:'<span class="gm-thumb t-countries" aria-hidden="true"><i class="f"></i><i></i><i class="f"></i><i></i><i class="f"></i><i></i><i class="f"></i><i class="f"></i><i></i></span>',
  citygrid:'<span class="gm-thumb t-cities" aria-hidden="true"><i style="height:22px;background:#5AA9E6"></i><i style="height:34px;background:#F0567F"></i><i style="height:16px;background:#FFB938"></i><i style="height:28px;background:#FFF6EE"></i></span>',

  top10:'<span class="gm-thumb t-top" aria-hidden="true"><i style="width:100%"></i><i style="width:80%"></i><i style="width:60%;opacity:.4"></i><i style="width:40%;opacity:.4"></i></span>',

const G=Geomingo,esc=G.esc;
function draw(){
  const live=G.live(),res=live.map(g=>G.result(g.id)),n=res.filter(r=>r.done).length,N=live.length;
  const ms=G.msToMidnight(),next='new games in '+Math.floor(ms/36e5)+'h '+String(Math.floor(ms%36e5/6e4)).padStart(2,'0')+'m';
  const set=(id,h)=>{const el=document.getElementById(id);if(el.innerHTML!==h)el.innerHTML=h}; // redraw only what changed (keeps keyboard focus)
  set('top',G.header());
  const st=G.streak();
  set('hello',
    n===0?G.hello('hello',G.greeting(),N+' games waiting for you · '+next,{size:64})
    :n===N?G.hello('happy','All done! '+(st>1?st+' days in a row.':'See you at midnight.'),'All '+N+' played today · '+next,{size:64})
    :G.hello('happy',st>1?'Nice one! '+st+' days in a row.':'Nice one! Keep going.',n+' of '+N+' played today · '+next,{size:64}));
  set('games',G.GAMES.map(g=>{
    const r=g.soon?{}:G.result(g.id),fresh=g.id==='silhouette';
    const state=g.soon?'<span class="gm-state soon">Coming soon</span>':r.done?'<span class="gm-state done">✓ '+esc(r.label)+'</span>':'<span class="gm-state">Play</span>';
    const inner=THUMB[g.id]+'<span class="gm-ctext"><b>'+esc(g.name)+(fresh?' <span class="gm-new">NEW</span>':'')+'</b><span>'+esc(g.hint)+'</span></span>'+state;

      :'<li><a class="gm-card" href="'+g.href+'" aria-label="'+esc(g.name)+': '+(r.done?'played today, '+esc(r.label):'play')+'">'+inner+'</a></li>'}).join(''))}
draw();
setInterval(draw,30000);
// coming back from a game in the same tab, or a new day while the page is open

document.addEventListener('visibilitychange',()=>{if(!document.hidden)draw()});
